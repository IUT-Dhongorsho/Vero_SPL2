# Typechecks every package, runs every service's tests against throwaway
# Postgres databases, and builds the web and desktop apps.
#
# There is no workspace: each package installs its own dependencies with bun,
# as scripts/dev-stack.sh does locally. Lockfiles are not committed, so the
# install resolves from each package.json.
name: CI

on:
  push:
    branches: [main, integration]
  pull_request:

defaults:
  run:
    working-directory: code

env:
  # Shared first: the others depend on it through file:../packages/shared.
  PACKAGES: >-
    packages/shared apps/ui apps/web apps/desktop
    services/auth-service services/board-service services/chat-service services/notes-service
    services/notification-service services/project-service services/meet-service ai-worker

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      PG_URL: postgresql://postgres:postgres@localhost:5432
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Bun's download cache, keyed on every package.json.
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('code/**/package.json', '!code/**/node_modules/**') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: |
          for pkg in $PACKAGES; do
            echo "::group::$pkg" && (cd "$pkg" && bun install) && echo "::endgroup::" || exit 1
          done

      - name: Typecheck
        run: |
          (cd packages/shared && bun run build)
          for pkg in apps/ui services/auth-service services/board-service services/chat-service \
                     services/notes-service services/notification-service services/project-service ai-worker; do
            echo "::group::$pkg" && (cd "$pkg" && ./node_modules/.bin/tsc --noEmit -p .) && echo "::endgroup::" || exit 1
          done

      - name: Tests
        run: ./scripts/test-all.sh

      - name: Build web and desktop
        run: |
          (cd apps/web && bun run build)
          (cd apps/desktop && bun run build)
