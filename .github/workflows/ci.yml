# Typechecks every package, runs every service's tests against throwaway
# Postgres databases, and builds the web and desktop apps.
name: CI

on:
  push:
    branches: [main, integration]
  pull_request:

defaults:
  run:
    working-directory: code

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      PG_URL: postgresql://postgres:postgres@localhost:5432
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          (cd packages/shared && pnpm run build)
          for pkg in apps/ui services/auth-service services/board-service services/chat-service \
                     services/notes-service services/notification-service services/project-service ai-worker; do
            echo "::group::$pkg" && (cd "$pkg" && npx tsc --noEmit -p .) && echo "::endgroup::"
          done

      - name: Tests
        run: ./scripts/test-all.sh

      - name: Build web and desktop
        run: |
          (cd apps/web && pnpm run build)
          (cd apps/desktop && pnpm run build)
