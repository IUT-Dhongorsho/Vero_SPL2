# Packaging for the Vero desktop app: `bun run electron:build` (from apps/desktop).
appId: com.vero.app
productName: Vero
copyright: Copyright © 2026 Vero
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - electron/**/*
  - package.json
# vero:// links (OAuth hand-off, deep links) open the app.
protocols:
  - name: Vero
    schemes: [vero]
mac:
  category: public.app-category.productivity
  icon: resources/icon.png
  target: [dmg, zip]
win:
  icon: resources/icon.png
  target: [nsis]
linux:
  icon: resources/icon.png
  category: Office
  target: [AppImage, deb]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
