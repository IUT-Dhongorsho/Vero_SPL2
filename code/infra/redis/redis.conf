# Redis for Vero: pub/sub between services, BullMQ queues (module provisioning,
# notification scheduling, AI jobs), presence and socket.io adapters.
#
# Queues must survive restarts, so persist with an append-only file. BullMQ
# requires that keys are never evicted.
appendonly yes
appendfsync everysec
maxmemory-policy noeviction
save 900 1
save 300 10
tcp-keepalive 60
