# Docker gateway (infra/docker/docker-compose.yml): serves the built web app
# and routes /api to the service containers. Mounted as the default site.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream vero_auth         { server auth-service:8001; }
upstream vero_board        { server board-service:8002; }
upstream vero_notes        { server notes-service:8003; }
upstream vero_project      { server project-service:8004; }
upstream vero_chat         { server chat-service:8005; }
upstream vero_notification { server notification-service:8006; }
upstream vero_meet         { server meet-service:8007; }

server {
    listen 80;
    server_name _;

    include /etc/nginx/vero-routes.conf;

    root /usr/share/nginx/html;

    # Hashed build assets never change; cache them hard.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The service worker must always be fresh, or push stops updating.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Single-page app: unknown paths render index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
