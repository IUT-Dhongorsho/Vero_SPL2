# Vero Gateway: Nginx reverse proxy & static SPA server.
#
# Listens on port 3000 to serve the built static SPA from code/apps/web/dist
# and reverse proxies /api/* calls to clustered microservice upstreams (ports 8001-8007 and 8011-8017).
#
# Run locally with:
#   nginx -p "$(pwd)/code/infra/nginx" -c nginx.conf

pid temp/nginx.pid;
error_log temp/error.log warn;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    access_log temp/access.log;
    client_body_temp_path temp/client_body;
    proxy_temp_path temp/proxy;
    fastcgi_temp_path temp/fastcgi;
    uwsgi_temp_path temp/uwsgi;
    scgi_temp_path temp/scgi;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ==========================================
    # UPSTREAM CLUSTERS (Instance 1 & Instance 2)
    # ==========================================

    # Stateless REST (Least Connections + Failover)
    upstream vero_auth {
        least_conn;
        server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8011 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream vero_board {
        least_conn;
        server 127.0.0.1:8002 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8012 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream vero_notes {
        least_conn;
        server 127.0.0.1:8003 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8013 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream vero_project {
        least_conn;
        server 127.0.0.1:8004 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8014 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Stateful WebSockets (IP Hash for Handshake Stability)
    upstream vero_chat {
        ip_hash;
        server 127.0.0.1:8005 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8015 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream vero_notification {
        ip_hash;
        server 127.0.0.1:8006 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8016 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream vero_meet {
        ip_hash;
        server 127.0.0.1:8007 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8017 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ==========================================
    # GATEWAY SERVER (Port 3000)
    # ==========================================
    server {
        listen 3000;
        server_name localhost _;

        root ../../apps/web/dist;

        include vero-routes.conf;

        # Static assets with long cache
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Service worker (always fresh)
        location = /sw.js {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # SPA router fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
