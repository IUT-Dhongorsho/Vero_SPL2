# Local / LAN gateway: HTTPS on :8443 in front of the Vite dev server and the
# services running on this machine (./scripts/dev-stack.sh).
#
#   nginx -p "$(pwd)" -c nginx.conf        (from code/infra/nginx)
#
# HTTPS matters on a LAN: browsers only allow camera, microphone, push and
# service workers on secure origins. Generate the self-signed pair into
# certs/ (see doc/nginx-setup.md); the key is never committed.

events {
    worker_connections 1024;
}

http {

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream vero_frontend     { server 127.0.0.1:3000; }
    upstream vero_auth         { server 127.0.0.1:8001; }
    upstream vero_board        { server 127.0.0.1:8002; }
    upstream vero_notes        { server 127.0.0.1:8003; }
    upstream vero_project      { server 127.0.0.1:8004; }
    upstream vero_chat         { server 127.0.0.1:8005; }
    upstream vero_notification { server 127.0.0.1:8006; }
    upstream vero_meet         { server 127.0.0.1:8007; }

    server {
        listen 8443 ssl;
        server_name localhost *.nip.io;

        ssl_certificate     certs/nginx-selfsigned.crt;
        ssl_certificate_key certs/nginx-selfsigned.key;
        include conf.d/ssl.conf;

        include vero-routes.conf;

        # Everything else is the Vite dev server, HMR WebSocket included.
        location / {
            proxy_pass http://vero_frontend;
        }
    }
}
