# Vero API gateway routes — included inside a `server` block by both
# nginx.conf (local / LAN HTTPS in front of Vite) and conf.d/vero.conf (Docker).
#
# Keep in step with the proxy table in apps/web/vite.config.ts: the browser
# only ever talks to /api/*, and these decide which service answers and
# whether the prefix is stripped.
#
# Requires upstreams named vero_auth, vero_board, vero_notes, vero_project,
# vero_chat, vero_notification and vero_meet, and $connection_upgrade from a map.

client_max_body_size 60m;          # project files are capped at 50 MB
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
proxy_next_upstream_tries 2;

# Service metrics are for Prometheus, which scrapes each service directly;
# keep them off the public gateway (and the zrok tunnel in front of it).
# A regex location wins over the prefix locations below.
location ~ ^/api/.*/metrics$ { return 404; }

# auth-service: Better Auth keeps its own prefix …
location /api/better-auth/ { proxy_pass http://vero_auth; }
# … the rest of auth-service is mounted at the root.
location /api/auth/     { proxy_pass http://vero_auth/auth/; }
location /api/user/     { proxy_pass http://vero_auth/user/; }
location /api/users/    { proxy_pass http://vero_auth/users/; }
location /api/mail/     { proxy_pass http://vero_auth/mail/; }
# /internal/verify only describes the caller's own session; the app uses it
# to restore sign-in where the cookie is unavailable (desktop).
location /api/internal/ { proxy_pass http://vero_auth/internal/; }

# board-service mounts its routes under /api/board itself.
location /api/board/ { proxy_pass http://vero_board; }

# notes-service answers on both /api/notes/* and /*; Yjs is a WebSocket.
# AI summaries can take a couple of minutes.
location /api/notes/ {
    proxy_pass http://vero_notes;
    proxy_read_timeout 3600s;
}

location /api/project/ { proxy_pass http://vero_project/project/; }

# chat-service: REST and socket.io at its root.
location /api/chat/ {
    proxy_pass http://vero_chat/;
    proxy_read_timeout 3600s;
}

# notification-service: REST and socket.io under /notifications.
location /api/notifications {
    proxy_pass http://vero_notification/notifications;
    proxy_read_timeout 3600s;
}

location /api/meet/ {
    proxy_pass http://vero_meet/;
    proxy_read_timeout 3600s;
}
