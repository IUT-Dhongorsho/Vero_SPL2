# Scrapes the services scripts/dev-stack.sh runs on the host: a primary
# (80xx) and a replica (801x) of each, plus the AI worker on 8008.
# Prometheus runs in Docker, so the host is host.docker.internal.
#
#   ./scripts/dev-stack.sh monitoring        # or:
#   docker compose -f infra/docker/monitoring.dev.yml up -d
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: vero
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8001', 'host.docker.internal:8011']
        labels: { service: auth }
      - targets: ['host.docker.internal:8002', 'host.docker.internal:8012']
        labels: { service: board }
      - targets: ['host.docker.internal:8003', 'host.docker.internal:8013']
        labels: { service: notes }
      - targets: ['host.docker.internal:8004', 'host.docker.internal:8014']
        labels: { service: project }
      - targets: ['host.docker.internal:8005', 'host.docker.internal:8015']
        labels: { service: chat }
      - targets: ['host.docker.internal:8006', 'host.docker.internal:8016']
        labels: { service: notification }
      - targets: ['host.docker.internal:8008']
        labels: { service: ai-worker }

  - job_name: vero-meet
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8007', 'host.docker.internal:8017']
        labels: { service: meet }

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
