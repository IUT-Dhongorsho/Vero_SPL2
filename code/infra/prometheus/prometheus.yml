# Scrapes every Vero service's /metrics (prom-client) inside the Docker stack.
# Used by the `monitoring` profile in docker/docker-compose.yml.
# For services started by scripts/dev-stack.sh, see prometheus.dev.yml.
#
# `service` is the short name the Grafana dashboard groups and colours by.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: vero
    metrics_path: /metrics
    static_configs:
      - targets: ['auth-service:8001']
        labels: { service: auth }
      - targets: ['board-service:8002']
        labels: { service: board }
      - targets: ['notes-service:8003']
        labels: { service: notes }
      - targets: ['project-service:8004']
        labels: { service: project }
      - targets: ['chat-service:8005']
        labels: { service: chat }
      - targets: ['notification-service:8006']
        labels: { service: notification }
      - targets: ['ai-worker:8008']
        labels: { service: ai-worker }

  # Meet only runs with `--profile meet`; without it this target reads as down.
  - job_name: vero-meet
    metrics_path: /metrics
    static_configs:
      - targets: ['meet-service:8007']
        labels: { service: meet }

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
